[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ieqstar"
authors = [
    {name = "Jun Jiang", email = "jun.jiang@eonerc.rwth-aachen.de"},
]
description = "Indoor Environmental Quality – Subject Test Archive and Repository"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["subject test", "data structure"]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic",
    "pydantic_extra_types",
    "ruff",
]
dynamic = ["version"]

[project.urls]
"Repository" = "https://github.com/RWTH-EBC/IEQ-STAR"

[dependency-groups]
dev = [
    "pytest"
]

[tool.setuptools.dynamic]
version = {attr = "ieqstar.__version__"}

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__init__.py",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "PL", "C90", "N", "ERA", "RUF", "TID", "SIM"]
ignore = ["PLR2004", "RUF015"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "--basetemp=./_tmp"
